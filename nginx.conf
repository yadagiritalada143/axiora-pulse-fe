# Serves the built Vite SPA. Sits BEHIND the edge Caddy container, which terminates
# TLS and routes /api/* to the backend — so this server only ever receives non-API
# requests and just needs static serving + SPA fallback.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths return index.html so client-side routing works
    # (fixes 404 on deep-link refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
