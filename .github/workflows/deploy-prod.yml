# axiora-pulse-fe/.github/workflows/deploy-prod.yml
#
# Release -> Production for the frontend. Promotes the QA-tested image (retag, NO
# rebuild) and deploys it to the prod box behind a manual approval gate.
#
#   push to release/x.y.z  ->  promote sha -> prod / YYYY-MM-DD / vX.Y.Z
#                          ->  [approval required]  ->  deploy `web` on prod box
#
# OIDC (promote) job is ref-based with NO environment, so its subject matches the
# IAM trust policy. The approval gate is on the deploy job (SSH, no OIDC).

name: Deploy production

on:
  push:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "sha-<...> to promote & deploy (defaults to this commit's sha)"
        required: false
        type: string

concurrency:
  group: deploy-prod-fe
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ECR_REGISTRY }}/axiora-pulse-fe"
          if [ -n "${{ inputs.image_tag }}" ]; then
            SHA_TAG="${{ inputs.image_tag }}"
          else
            SHA_TAG="sha-${GITHUB_SHA::12}"
          fi
          case "${GITHUB_REF_NAME}" in
            release/*) VERSION="v${GITHUB_REF_NAME#release/}" ;;
            *)         VERSION="" ;;
          esac
          {
            echo "image=$IMAGE"
            echo "sha_tag=$SHA_TAG"
            echo "version=$VERSION"
            echo "date=$(date +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $IMAGE:$SHA_TAG (version=${VERSION:-none})"

      - name: Verify the image exists (built & QA-tested on develop)
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --repository-name axiora-pulse-fe \
            --image-ids imageTag=${{ steps.meta.outputs.sha_tag }} \
            --region ${{ vars.AWS_REGION }} >/dev/null \
          || { echo "::error::Image ${{ steps.meta.outputs.sha_tag }} not in ECR. Build this commit on develop (QA) first."; exit 1; }

      - name: Promote (retag existing image — no rebuild)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          TAGS="--tag $IMAGE:prod --tag $IMAGE:${{ steps.meta.outputs.date }}"
          if [ -n "${{ steps.meta.outputs.version }}" ]; then
            TAGS="$TAGS --tag $IMAGE:${{ steps.meta.outputs.version }}"
          fi
          docker buildx imagetools create $TAGS "$IMAGE:${{ steps.meta.outputs.sha_tag }}"
          echo "Promoted ${{ steps.meta.outputs.sha_tag }} -> prod, ${{ steps.meta.outputs.date }}"

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    environment: Production        # <-- required-reviewer approval gate; SSH only, no OIDC
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to prod (pull the pinned image)
        env:
          HOST: ${{ secrets.PROD_EC2_HOST }}
          IMAGE_TAG_FE: ${{ needs.promote.outputs.sha_tag }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "ubuntu@$HOST" bash -s <<EOF
            set -euo pipefail
            cd /opt/axiora
            sed -i "s|^IMAGE_TAG_FE=.*|IMAGE_TAG_FE=${IMAGE_TAG_FE}|" .env
            aws ecr get-login-password --region ${REGION} \
              | docker login --username AWS --password-stdin ${REGISTRY}
            docker compose pull web
            docker compose up -d web
          EOF

      - name: Smoke test
        env:
          HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "ubuntu@$HOST" \
            'docker compose -f /opt/axiora/docker-compose.yml exec -T api curl -fsS http://web:80/ >/dev/null' \
            && echo "Prod frontend responding"
